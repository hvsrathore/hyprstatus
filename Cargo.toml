[package]
name = "hyprstatus"
version = "0.1.0"
edition = "2024"

[dependencies]
fontdue = "0.9.5"
hyprland = "0.3.13"
libc = "0.2.191"
memmap2 = "0.9.12"
notify = "8.2.1"
pipewire = "0.10.1"
rtnetlink = "0.23.0"
rustix = { version = "1.1.5", features = ["fs", "shm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
zbus = "6.1.0"
