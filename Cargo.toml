[package]
name = "hyprstatus"
version = "1.0.5"
edition = "2021"
authors = ["Harsh Vardhan <4444hv@gmail.com>"]
license = "MIT"
description = "A blazing-fast, zero-bloat, i3-style status bar daemon designed specifically for Hyprland in pure Rust"
repository = "https://github.com/hvsrathore/hyprstatus"
homepage = "https://github.com/hvsrathore/hyprstatus"
documentation = "https://docs.rs/hyprstatus"
readme = "README.md"
keywords = ["hyprland", "status-bar", "wayland", "i3status", "pipewire"]
categories = ["command-line-utilities", "gui"]

[dependencies]
fontdue = "0.9.5"
hyprland = "0.3.13"
libc = "0.2.191"
memmap2 = "0.9.12"
notify = "8.2.1"
pipewire = "0.10.1"
rtnetlink = "0.23.0"
rustix = { version = "1.1.5", features = ["fs", "shm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
xkbcommon = { version = "0.8", features = ["wayland"] }
zbus = "6.1.0"
